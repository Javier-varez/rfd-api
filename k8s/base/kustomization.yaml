apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base is not deployable on its own: it references the rfd-api-config,
# rfd-processor-config and rfd-postgres secrets and the rfd-api-mappers config
# map, all of which an overlay is expected to generate. See overlays/dev.

namespace: rfd

resources:
  - namespace.yaml
  - postgres.yaml
  - rfd-api.yaml
  - rfd-processor.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: rfd
