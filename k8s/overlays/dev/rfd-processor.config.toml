# Placeholder rfd-processor configuration for the dev overlay.
#
# Nothing in this file is a real secret. Copy this overlay and substitute real
# values for a real deployment; the file is loaded into the
# rfd-processor-config secret by kustomize, so treat your copy as sensitive.
#
# The container runs with a read-only root filesystem. /tmp and /home/rfd are
# writable (the renderer stages content in /tmp and Chromium needs a writable
# home); leave `log_directory` unset so logs go to stdout.

log_format = "json"

processor_enabled = true
processor_batch_size = 10
processor_interval = 30
processor_capacity = 4

# "read" generates what would be written without persisting it. Switch to
# "write" once the GitHub credentials below are real.
processor_update_mode = "read"

scanner_enabled = true
scanner_interval = 900

# Overridden at runtime by the DATABASE_URL environment variable taken from the
# rfd-postgres secret.
database_url = "postgres://rfd:replace-me@postgres:5432/rfd"

# With no actions enabled the processor only builds its database of RFDs. See
# rfd-processor/config.example.toml for the full list.
actions = []

[auth.github]
token = "replace-me"

[source]
owner = "oxidecomputer"
repo = "rfd"
path = "rfd"
default_branch = "master"
